name: "Import smoke"

on:
  push:
    paths:
      - ".github/workflows/import-smoke.yaml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "dp5/neural_net/**"
      - "tests/test_neural_net_imports.py"
  pull_request:
    paths:
      - ".github/workflows/import-smoke.yaml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "dp5/neural_net/**"
      - "tests/test_neural_net_imports.py"
  workflow_dispatch:

jobs:
  imports:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
          - macos-14
    env:
      DP5_ASSERT_TENSORFLOW_METAL_MARKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install DP5
        run: uv sync --locked
      - name: Run import smoke tests
        run: uv run python -m unittest tests.test_neural_net_imports
      - name: Run direct neural-net import command
        run: uv run python -c "import tensorflow, keras, rdkit; from dp5.neural_net.nn_utils import get_nn_shifts; print('ok')"
